name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev libdbus-1-dev libxcursor-dev
      - run: make dist
      - name: Generate release notes
        id: notes
        run: |
          TAG_MESSAGE=$(git tag -l --format='%(contents:subject)' "${{ github.ref_name }}")
          echo "## What's Changed" > /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          PREV=$(git describe --tags --abbrev=0 $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            git log --oneline "$PREV".."${{ github.ref_name }}" | while read -r line; do
              echo "* $line" >> /tmp/release-notes.md
            done
          else
            git log --oneline "${{ github.ref_name }}" | while read -r line; do
              echo "* $line" >> /tmp/release-notes.md
            done
          fi
          echo "tag_message=$TAG_MESSAGE" >> "$GITHUB_OUTPUT"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ steps.notes.outputs.tag_message }}" \
            --notes-file /tmp/release-notes.md \
            dist/kpixiv-*.tar.gz
