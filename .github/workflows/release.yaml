name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch annotated tag object
        run: |
          git fetch origin +refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev libdbus-1-dev libxcursor-dev
      - run: make dist
      - name: Generate release title
        run: |
          TITLE=$(git tag -l --format='%(contents:subject)' "${{ github.ref_name }}" 2>/dev/null) || TITLE="${{ github.ref_name }}"
          printf '%s\n' "$TITLE" > /tmp/release-title.txt
      - name: Generate release notes
        id: notes
        run: |
          TAG_BODY=$(git tag -l --format='%(contents:body)' "${{ github.ref_name }}" 2>/dev/null) || TAG_BODY=""
          if [ -n "$TAG_BODY" ]; then
            printf '%s\n' "$TAG_BODY" > /tmp/release-notes.md
          else
            echo "## What's Changed" > /tmp/release-notes.md
            echo "" >> /tmp/release-notes.md
            PREV=$(git describe --tags --abbrev=0 $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || true)
            if [ -n "$PREV" ]; then
              git log --oneline "$PREV".."${{ github.ref_name }}" | while read -r line; do
                echo "* $line" >> /tmp/release-notes.md
              done
            else
              git log --oneline "${{ github.ref_name }}" | while read -r line; do
                echo "* $line" >> /tmp/release-notes.md
              done
            fi
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "$(cat /tmp/release-title.txt)" \
            --notes-file /tmp/release-notes.md \
            dist/kpixiv-*.tar.gz
