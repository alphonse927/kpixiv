version: "2"

run:
  timeout: 5m

linters:
  default: none

  enable:
    # Core correctness
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused

    # Error handling
    - errorlint
    - nilerr
    - nilnesserr
    - nilnil

    # Networking / concurrency / resources
    - bodyclose
    - contextcheck
    - copyloopvar
    - durationcheck

    # Code quality
    - revive
    - gocritic
    - misspell
    - nolintlint

    # Complexity management
    - cyclop
    - funlen
    - nestif

    # Performance / modernization
    - intrange
    - makezero
    - prealloc
    - unconvert

    # Security
    - gosec

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true

    govet:
      enable:
        - shadow

    cyclop:
      max-complexity: 15

    funlen:
      lines: 120
      statements: 60

    nestif:
      min-complexity: 5

    revive:
      rules:
        - name: exported
          disabled: true

        - name: package-comments
          disabled: true

    gosec:
      excludes:
        # Dynamic file paths are common in CLI/Linux apps
        - G304

    gocritic:
      enabled-checks:
        - badLock
        - boolExprSimplify
        - builtinShadow
        - dupImport
        - emptyFallthrough
        - hugeParam
        - indexAlloc
        - initClause
        - nilValReturn
        - rangeExprCopy
        - unnecessaryBlock

  exclusions:
    generated: lax

    rules:
      # Tests intentionally ignore some errors
      - path: '(.+)_test\.go'
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

severity:
  default: warning
